<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BoutiqueKiku – Veshje dhe modë e përzgjedhur nga Vushtrria. Pagesa në dorëzim.">
<meta name="theme-color" content="#000000">
<title>BoutiqueKiku – Moda nga Vushtrria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--s:#f4f4f4;--tx:#000;--mu:#707070;--ln:#e5e5e5;--ac:#000;--acx:#fff;--ok:#1d7a46;--er:#c00;--warn:#b8860b;--sh:0 2px 12px rgba(0,0,0,.06);--shl:0 8px 32px rgba(0,0,0,.12);--tr:.25s cubic-bezier(.4,0,.2,1);
--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e0e10;--s:#18181b;--tx:#ecebe8;--mu:#9a9ba1;--ln:#2b2b30;--ac:#d4b3c4;--acx:#1a1218;--ok:#6fc29b;--er:#e48a8a;--warn:#e0b060;--sh:0 2px 12px rgba(0,0,0,.4);--shl:0 8px 32px rgba(0,0,0,.6);color-scheme:dark}
html,body{max-width:100vw;overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;transition:background var(--tr),color var(--tr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--sans);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.01em}
.wrap{max-width:1600px;margin:0 auto;padding:0 20px;width:100%}
/* HEADER */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--ln);transition:background var(--tr)}
.top{background:var(--tx);color:var(--bg);text-align:center;font-size:11px;padding:8px 12px;letter-spacing:.05em;font-weight:500}
.bar{display:grid;grid-template-columns:1fr auto 1fr;height:64px;align-items:center;gap:10px;width:100%}
.bar .l,.bar .r{display:flex;align-items:center;gap:6px}
.bar .l{justify-content:flex-start}
.bar .r{justify-content:flex-end}
.brand{font:600 20px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;justify-content:center;text-align:center;transition:opacity var(--tr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand:hover{opacity:.7}
.brand img{height:32px;width:auto;margin:0 auto}
nav{display:flex;gap:16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
nav a{color:var(--tx);padding:4px 0;border-bottom:1px solid transparent;transition:border-color var(--tr);white-space:nowrap}
nav a:hover,nav a.on{border-color:var(--tx)}
.ib{background:none;border:0;cursor:pointer;padding:6px;position:relative;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;transition:opacity var(--tr);white-space:nowrap}
.ib:hover{opacity:.7}
.cnt{position:absolute;top:-2px;right:-4px;background:var(--ac);color:var(--acx);border-radius:9px;min-width:16px;height:16px;font-size:10px;display:grid;place-items:center;font-weight:600;padding:0 4px}
#mb{display:none}
@media(max-width:900px){
  .wrap{padding:0 16px}
  .bar{height:56px;gap:8px}
  nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:16px;border-bottom:1px solid var(--ln);gap:16px;box-shadow:var(--shl)}
  nav.open{display:flex}
  #mb{display:block}
  .brand{font-size:18px;letter-spacing:.05em}
  .brand img{height:28px}
}
/* BUTTONS */
.btn{display:inline-block;background:var(--ac);color:var(--acx);border:1px solid var(--ac);padding:12px 24px;cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;transition:all var(--tr);text-align:center;border-radius:2px}
.btn:hover{opacity:.85;transform:translateY(-1px);box-shadow:var(--sh)}
.btn:active{transform:translateY(0)}
.btn.o{background:none;color:var(--tx);border-color:var(--tx)}
.btn.o:hover{background:var(--tx);color:var(--bg)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.wa:hover{background:#1faa50;border-color:#1faa50}
.btn.er{background:var(--er);border-color:var(--er);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
/* HERO */
.hero{position:relative;min-height:calc(80vh - 64px);display:grid;align-items:end;background-color:#000;background-size:cover;background-position:center;color:#fff;overflow:hidden;width:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 60%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-bottom:40px;width:100%;animation:rise .9s ease both}
.hero h1{font-size:clamp(32px,8vw,64px);max-width:16ch;line-height:1.1;letter-spacing:-.01em;font-weight:600;color:#fff}
.hero p{font-size:15px;max-width:40ch;margin:12px 0 20px;opacity:.9;color:#fff}
.hero .btns{display:flex;gap:16px;flex-wrap:wrap}
.hero .btn{background:none;color:#fff;border:0;border-bottom:1px solid #fff;padding:0 0 3px;text-transform:uppercase;font-size:12px;letter-spacing:.08em;border-radius:0}
.hero .btn:hover{transform:none;opacity:.7;box-shadow:none}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* SECTIONS */
section{padding-top:48px;width:100%}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.sh h2{font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.sh a{color:var(--tx);border-bottom:1px solid var(--tx);font-size:12px;text-transform:uppercase;letter-spacing:.05em;transition:opacity var(--tr)}
.sh a:hover{opacity:.6}
/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 6px;width:100%}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:16px 6px}}
.card-wrap{position:relative;width:100%;overflow:hidden}
.card{display:block;transition:opacity var(--tr);width:100%}
.card:hover{opacity:.92}
.m{position:relative;aspect-ratio:2/3;background:var(--s);overflow:hidden;display:grid;place-items:center;width:100%}
.m img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.card:hover .m img{transform:scale(1.05)}
.ph{font:600 48px var(--sans);color:var(--mu);opacity:.18}
.tag{position:absolute;top:0;left:0;background:var(--tx);color:var(--bg);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;z-index:2}
.tag.sale{background:var(--er);color:#fff}
.fav-btn{position:absolute;top:6px;right:6px;background:var(--bg);border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:14px;z-index:2;transition:transform var(--tr),background var(--tr);box-shadow:var(--sh)}
.fav-btn:hover{transform:scale(1.1)}
.fav-btn.on{background:var(--er);color:#fff}
.m .h2{position:absolute;inset:0;opacity:0;transition:opacity .3s;object-fit:cover}
.card:hover .m .h2{opacity:1}
.qs{position:absolute;left:0;right:0;bottom:0;background:var(--bg);color:var(--tx);padding:8px;font-size:11px;text-align:center;transform:translateY(100%);transition:transform .25s;font-weight:500}
.card:hover .qs{transform:none}
@media(hover:none){.qs{display:none}.fav-btn{width:28px;height:28px;font-size:12px}}
.card h3{font:400 13px/1.3 var(--sans);margin:8px 0 2px;color:var(--tx);word-break:break-word}
.card .pr{color:var(--tx);font-size:13px;font-weight:500}
.card .pr s{opacity:.5;margin-left:4px;font-weight:400}
/* CATEGORIES */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%}
@media(min-width:900px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{aspect-ratio:4/5;background:var(--s);border:0;display:grid;align-items:end;text-align:left;padding:16px;transition:all var(--tr);position:relative;overflow:hidden;width:100%}
.cat:hover{background:var(--tx);color:var(--bg)}
.cat:hover span{color:var(--mu)}
.cat h3{font:600 18px var(--sans);text-transform:uppercase;letter-spacing:.02em;position:relative;z-index:1}
.cat span{color:var(--mu);font-size:12px;transition:color var(--tr);position:relative;z-index:1}
/* BAND */
.band{background:var(--tx);color:var(--bg);margin-top:48px;padding:40px 20px;text-align:center;width:100%}
.band h2{font-size:clamp(22px,4vw,36px);margin-bottom:10px;color:var(--bg)}
.band p{margin:0 0 18px;opacity:.8;color:var(--bg);font-size:14px}
.band .btn{background:var(--bg);color:var(--tx);border-color:var(--bg)}
.band .btn:hover{background:var(--bg);opacity:.85}
/* VALUES */
.val{padding:40px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;width:100%}
.val h3{font:600 14px var(--sans);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.val p{margin:0;color:var(--mu);font-size:14px}
/* PRODUCT PAGE */
.pg{display:grid;grid-template-columns:1.7fr 1fr;gap:32px;padding-top:28px;width:100%}
@media(max-width:820px){.pg{grid-template-columns:1fr;gap:20px}}
.pg>div:last-child{position:sticky;top:100px;align-self:start}
@media(max-width:820px){.pg>div:last-child{position:static}}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.gal:has(.m:only-child){grid-template-columns:1fr;max-width:100%}
@media(max-width:560px){.gal{grid-template-columns:1fr}}
.pg h1{font-size:20px;margin:4px 0 0;font-weight:600;word-break:break-word}
.price{font-size:18px;font-weight:500;margin:8px 0 14px}
.price s{opacity:.5;font-weight:400;margin-left:6px;font-size:14px}
.pg .btn{width:100%}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.chip{border:1px solid var(--ln);background:var(--s);padding:6px 14px;cursor:pointer;min-width:40px;text-align:center;transition:all var(--tr);font-size:13px}
.chip:hover{border-color:var(--tx)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.lb{font-size:13px;color:var(--mu)}
.note{color:var(--mu);font-size:13px;margin-top:14px}
.crumb{color:var(--mu);font-size:13px;padding-top:20px}
.crumb a:hover{color:var(--tx)}
/* CART */
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:center;width:100%}
.line .m{aspect-ratio:2/3;width:64px}
.q{display:inline-flex;align-items:center;border:1px solid var(--ln)}
.q button{background:none;border:0;width:28px;height:28px;cursor:pointer;font-size:16px;transition:background var(--tr)}
.q button:hover{background:var(--s)}
.q span{min-width:28px;text-align:center;font-weight:500;font-size:14px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;padding-top:24px;width:100%}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:20px}}
.box{background:var(--s);border:1px solid var(--ln);padding:20px;width:100%;overflow:hidden}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.tot.b{font:600 20px var(--sans);border-top:1px solid var(--ln);margin-top:8px;padding-top:12px}
.tot.discount{color:var(--ok)}
/* FORMS */
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--ln);border-radius:0;transition:border-color var(--tr);color:var(--tx);font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--tx);outline:none}
textarea{min-height:80px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;width:100%}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
/* STATUS */
.ok{color:var(--ok)}.er{color:var(--er)}.warn-txt{color:var(--warn)}
.warn{background:var(--s);border-left:3px solid var(--warn);padding:10px 14px;margin-bottom:16px;font-size:13px}
/* EMPTY */
.empty{text-align:center;padding:60px 0;color:var(--mu)}
.empty h1,.empty h2{color:var(--tx);margin-bottom:10px}
/* ADMIN */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:24px 0 18px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px;width:100%}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mu);font-size:13px;white-space:nowrap;transition:all var(--tr);font-weight:500}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.tw{overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.thm{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thm img{width:48px;height:64px;object-fit:cover;border:1px solid var(--ln)}
/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;width:100%}
.stat{background:var(--s);border:1px solid var(--ln);padding:16px;transition:transform var(--tr)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat .v{font-size:24px;font-weight:600;line-height:1;margin-bottom:4px;font-family:var(--sans)}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:500}
.stat.g .v{color:var(--ok)}
.stat.e .v{color:var(--er)}
/* SEARCH */
.search{position:relative;flex:1;max-width:100%;min-width:200px}
.search input{padding-left:32px}
.search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translate(-50%,120%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:4px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shl);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:#fff}
#toast.er{background:var(--er);color:#fff}
/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;width:100%}
.filters select,.filters input{width:auto;padding:6px 10px;font-size:13px}
/* PILLS */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0;overflow-x:auto;padding-bottom:4px;width:100%}
.pills a{border:1px solid var(--ln);padding:6px 12px;font-size:13px;white-space:nowrap;transition:all var(--tr)}
.pills a:hover{border-color:var(--tx)}
.pills a.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
/* FOOTER */
footer{background:var(--s);color:var(--tx);font-size:13px;margin-top:60px;padding:32px 0 20px;border-top:1px solid var(--ln);width:100%}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
footer a{color:var(--tx);text-decoration:underline;text-underline-offset:2px}
footer a:hover{opacity:.7}
footer .fcol{display:flex;flex-direction:column;gap:4px}
footer .fcol b{text-transform:uppercase;letter-spacing:.05em;font-size:11px;margin-bottom:2px;opacity:.6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* EMAIL STATUS */
#emailStatus{display:none;margin-top:10px;padding:10px 14px;font-size:13px;border-left:3px solid var(--ok);background:var(--s)}
#emailStatus.show{display:block}
#emailStatus.er{border-color:var(--er)}
</style>
</head>

<header>
<div class="wrap bar">

</header>

</footer>

/* ============ DËRGIM EMAIL ME EMAILJS ============ */
async function sendOrderEmail(order) {
    const itemsText = order.items.map(i =>
        `• ${i.q} × ${i.name}${i.size || i.color ? ' (' + [i.size, i.color].filter(Boolean).join(', ') + ')' : ''} — ${eur(i.price * i.q)}`
    ).join('\n');

    const params = {
        order_id:     order.id,
        order_date:   new Date(order.date).toLocaleString('sq-AL', { dateStyle: 'full', timeStyle: 'short' }),
        customer_name:  order.name,
        customer_phone: order.phone,
        customer_city:  order.city,
        customer_addr:  order.addr,
        customer_note:  order.note || '—',
        items_list: itemsText,
        subtotal:   eur(subtotal()),
        discount:   order.discount ? eur(order.discount) + (order.coupon ? ' (' + order.coupon + ')' : '') : '—',
        shipping:   fee() ? eur(fee()) : 'Do të njoftohet',
        total:      eur(order.total),
        brand:      cfg.brand
    };

    try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
        return { ok: true };
    } catch (err) {
        console.error('EmailJS error:', err);
        return { ok: false, error: err };
    }
}

async function img(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Skedari nuk mund të lexohet"));
    reader.onload = async (e) => {
      const image = new Image();
      image.onerror = () => reject(new Error("Imazhi nuk mund të hapet"));
      image.onload = async () => {
        try {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scale = Math.min(1, MAX_WIDTH / Math.max(image.width, image.height));
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          
          canvas.toBlob(async (blob) => {
            if (!blob) return reject(new Error("Konvertimi dështoi"));
            
            const fileName = `foto-${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
            
            const { data, error } = await sb.storage
              .from('products')
              .upload(fileName, blob, {
                contentType: 'image/jpeg',
                upsert: false
              });
            
            if (error) {
              console.error("GABIM GJATË NGARKIMIT:", error);
              return reject(error);
            }
            
            const { data: urlData } = sb.storage
              .from('products')
              .getPublicUrl(fileName);
            
            resolve(urlData.publicUrl);
          }, 'image/jpeg', 0.85);
        } catch (err) {
          reject(err);
        }
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function login(){
 const email=$("#a-email").value.trim();
 const pass=$("#a-pass").value;
 const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
 if (error) {
   $("#msg").textContent="Email ose fjalëkalim i gabuar!";
   toast("Hyrja dështoi.", "er");
   return;
 }
 const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
 if (profile?.role !== 'admin') {
   await sb.auth.signOut();
   $("#msg").textContent="Ky përdorues nuk është Admin!";
   return;
 }
 authed=true; route(1); toast("Mirë se vini, Admin!","ok");
}

function aDash(){
 const totalSales=O.filter(o=>o.status!=="Anuluar").reduce((a,o)=>a+o.total,0);
 const pending=O.filter(o=>o.status==="Në pritje").length;
 const delivered=O.filter(o=>o.status==="Dorëzuar").length;
 const prodCount=P.length;
 const topP={};
 O.forEach(o=>o.items.forEach(i=>{topP[i.name]=(topP[i.name]||0)+i.q}));
 const topList=Object.entries(topP).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<div class="stats">
 <div class="stat"><div class="v">${O.length}</div><div class="l">Porosi totale</div></div>
 <div class="stat g"><div class="v">${eur(totalSales)}</div><div class="l">Shitje totale</div></div>
 <div class="stat ${pending?"e":""}"><div class="v">${pending}</div><div class="l">Në pritje</div></div>
 <div class="stat"><div class="v">${delivered}</div><div class="l">Dorëzuar</div></div>
 <div class="stat"><div class="v">${prodCount}</div><div class="l">Produkte</div></div>
 </div>
 <div class="f2"><div class="box"><h3 style="font-size:16px;margin-bottom:10px">Produktet më të shitura</h3>
 ${topList.length?topList.map(([n,c])=>`<div class="tot"><span>${esc(n)}</span><b>${c} herë</b></div>`).join(""):'<p class="lb">Nuk ka të dhëna ende.</p>'}</div>
 <div class="box"><h3 style="font-size:16px;margin-bottom:10px">Porositë e fundit</h3>
 ${O.slice(0,5).map(o=>`<div class="tot"><span>${esc(o.id)}<div class="lb">${esc(o.name)}</div></span><span>${eur(o.total)}</span></div>`).join("")||'<p class="lb">Nuk ka porosi.</p>'}</div></div>`;
}

function aOrders(){

 return `<div class="tw"><table><tr><th>Porosia</th><th>Klienti</th><th>Produktet</th><th>Totali</th><th>Statusi</th><th></th></tr>
 ${O.map((o,i)=>`<tr><td><b>${esc(o.id)}</b><br><span class="lb">${new Date(o.date).toLocaleDateString("sq-AL")}</span></td>
 <td>${esc(o.name)}<br><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><span class="lb">${esc(o.addr)}, ${esc(o.city)}${o.note?"<br>"+esc(o.note):""}</span></td>
 <td>${o.items.map(x=>`${x.q} × ${esc(x.name)} <span class="lb">${[x.size,x.color].filter(Boolean).map(esc).join(", ")}</span>`).join("<br>")}</td><td>${eur(o.total)}</td>

async function updateOrder(id, status) {
 const i = O.findIndex(x=>x.id === id);
 if(i > -1) { O[i].status = status; sv('orders',O); toast('Statusi u përditësua ✓','ok'); }
 const { error } = await sb.from('orders').update({ status }).eq('id', id);
 if(error) console.error(error);
}

async function deleteOrder(id) {
 O = O.filter(x => x.id !== id);
 sv('orders',O);
 route(1);
 const { error } = await sb.from('orders').delete().eq('id', id);
 if(error) console.error(error);
 else toast('U fshi ✓');
}

 <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="publish" style="width:auto" ${p.published?"checked":""}> Publiko (i dukshëm për klientët)</label>
 <label>Fotot (të parën e shfaq si kryesore)</label><input type="file" id="imgInput" accept="image/*" multiple onchange="addImgs(this.files);this.value='';">
 <div class="thm">${(p.imgs||[]).map((x,i)=>`<div><img src="${x}" alt=""><br><button class="btn sm o" onclick="ed.imgs.splice(${i},1);keep();route(1)">Hiq</button></div>`).join("")}</div>
 <p style="margin-top:16px"><button class="btn" onclick="saveP()">Ruaj produktin</button> <button class="btn o" onclick="ed=null;route(1)">Anulo</button></p></div>`;

function keep(){
  ed.name = $("#pn").value;
  ed.cat = $("#pc").value;
  ed.price = $("#pp").value;
  ed.old = $("#po").value;
  ed.stock = +$("#pst").value || 0;
  ed.sizes = $("#ps").value.split(",").map(s=>s.trim()).filter(Boolean);
  ed.colors = $("#pl").value.split(",").map(s=>s.trim()).filter(Boolean);
  ed.desc = $("#pd").value;
  ed.isNew = $("#pw1").checked;
  ed.best = $("#pb").checked;
  ed.published = $("#publish").checked;
}

async function addImgs(fs) {
  if (!fs || !fs.length) return;
  
  keep();
  
  const files = [...fs];
  toast(`Duke ngarkuar ${files.length} foto...`, "");
  
  const currentImgs = [...(ed.imgs || [])];
  
  for (const f of files) {
    try {
      const url = await img(f);
      currentImgs.push(url);
      ed.imgs = currentImgs;
    } catch (err) {
      console.error("Gabim gjatë ngarkimit:", err);
      toast("Ngarkimi i njërës prej fotove dështoi!", "er");
    }
  }
  
  ed.imgs = currentImgs;
  route(1);
  toast(`${files.length} foto u ngarkuan ✓`, "ok");
}

async function saveP(){
 keep();
 if(!ed.name||!ed.price)return toast("Shkruaj emrin dhe çmimin.","er");
 const p={...ed,price:+ed.price,old:+ed.old||0,demo:0};
 delete p._n;
 const i=P.findIndex(x=>x.id===p.id);
 i<0?P.unshift(p):P[i]=p;
 sv("products",P);
 
 const {error} = await sb.from('products').upsert([{
   id: p.id, name: p.name, cat: p.cat, price: p.price, old: p.old, desc: p.desc,
   sizes: p.sizes, colors: p.colors, imgs: p.imgs, stock: p.stock,
   is_new: p.isNew, best: p.best, demo: p.demo, published: p.published
 }]);
 if (error) toast("Ruajtja në cloud dështoi!","er");
 else { ed=null; route(1); toast("Produkti u ruajt ✓","ok"); }
}

async function deleteProduct(id){
 if(!confirm('Fshij produktin?'))return;
 P = P.filter(x=>x.id!==id);
 sv("products",P); route(1); toast('U fshi ✓');
 const {error} = await sb.from('products').delete().eq('id', id);
 if(error) console.error(error);
}

function aCoupons(){
 return `<div class="box"><h3 style="font-size:16px;margin-bottom:10px">Kuponët e zbritjes</h3>
 ${CUPS.length?`<div class="tw"><table><tr><th>Kodi</th><th>Tipi</th><th>Vlera</th><th>Min. porosi</th><th></th></tr>
 ${CUPS.map((c,i)=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.type==="pct"?"Përqindje":"Fikse"}</td><td>${c.type==="pct"?c.val+"%":eur(c.val)}</td><td>${c.min?eur(c.min):"-"}</td><td><button class="btn sm o" onclick="deleteCoupon('${c.code}')">Fshij</button></td></tr>`).join("")}</table></div>`:'<p class="lb">Nuk ka kuponë ende.</p>'}

 <div><label>Vlera</label><input id="cv" type="number" min="0" step="0.01"></div><div><label>Min. porosi (€, 0 = pa limit)</label><input id="cm" type="number" min="0" step="0.01" value="0"></div></div>
 <button class="btn sm" style="margin-top:10px" onclick="addCoupon()">+ Shto kupon</button></div>`;
}

async function addCoupon(){
 const code=$("#cc").value.trim().toUpperCase();
 if(!code)return toast("Shkruaj kodin.","er");
 if(CUPS.find(c=>c.code===code))return toast("Kodi ekziston.","er");
 const newC = { code, type: $("#ct").value, val: +$("#cv").value||0, min: +$("#cm").value||0 };
 CUPS.push(newC); sv("coupons",CUPS); route(1); toast("Kuponi u shtua ✓","ok");
 const {error} = await sb.from('coupons').insert([newC]);
 if(error) console.error(error);
}

async function deleteCoupon(code){
 CUPS = CUPS.filter(c => c.code !== code);
 sv("coupons",CUPS); route(1); toast('U fshi ✓');
 const {error} = await sb.from('coupons').delete().eq('code', code);
 if(error) console.error(error);
}

/* ============ ROUTER ============ */
function route(keepScroll){
 const h=location.hash.slice(1)||"ballina";let m,v;
 if(h==="ballina")v=home();
 else if(["koleksioni","te-reja","me-te-shitura"].includes(h)||/^kategori-\d+$/.test(h))v=shop(h);
 else if(m=h.match(/^produkt-(.+)$/))v=product(m[1]);
 else if(h==="shporta")v=cart();
 else if(h==="porosia")v=checkout();
 else if(h==="faleminderit")v=thanks();
 else if(h==="favoritet")v=favorites();
 else if(h==="admin")v=admin();
 else v=home();
 $("#app").innerHTML=v;$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");
 $$("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
 if(keepScroll!==1)window.scrollTo(0,0);
 if(h==="porosia")setTimeout(()=>{const n=$("#n"),t=$("#t"),c=$("#c"),a=$("#a"),o=$("#o");if(n)[n,t,c,a,o].forEach(el=>el.addEventListener("input",()=>sv("draft",{name:n.value,phone:t.value,city:c.value,addr:a.value,note:o.value})));},50);
}
addEventListener("hashchange",()=>{sel={size:"",color:"",gi:0};route()});
$("#mb").onclick=()=>{const n=$("#nav");n.classList.toggle("open");$("#mb").setAttribute("aria-expanded",n.classList.contains("open"))};

chrome();
route();

// Lexo të dhënat nga Supabase kur hapet faqja
async function loadData(){
  const [prods, ords, cps] = await Promise.all([
    sb.from('products').select('*'),
    sb.from('orders').select('*'),
    sb.from('coupons').select('*')
  ]);
  if(prods.data && prods.data.length) {
    P = prods.data.map(p => ({
      ...p, isNew: p.is_new, best: p.best, desc: p.desc, published: p.published,
      stock: p.stock, old: p.old, price: p.price
    }));
    sv("products", P);
    if(["#koleksioni","#te-reja","#me-te-shitura","#ballina",""].includes(location.hash)) route(1);
  }
  if(ords.data) { O = ords.data; sv("orders", O); }
  if(cps.data) { CUPS = cps.data; sv("coupons", CUPS); }
}
loadData();
</script>
